<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9ed"><title>小厨房开饭啦！</title><style>
:root{--cream:#fff9ed;--brown:#74594b;--peach:#f7c7bf;--green:#aec6a5;--ink:#59483e;--line:#eadccd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 22px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee3d4}.brand{font-size:19px;font-weight:900}.brand span{color:#d88e72}.top a{color:var(--brown);font-weight:700;text-decoration:none}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:36px;padding:42px 0}.eyebrow{font-size:12px;color:#bd816b;font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.1;margin:15px 0}.hero p{color:#877568;line-height:1.9;max-width:480px}.hero img{width:100%;height:315px;object-fit:cover;border-radius:34px 34px 34px 12px}.btn{border:0;border-radius:99px;padding:12px 19px;background:var(--brown);color:white;font-weight:850;cursor:pointer}.hero .btn{background:#e7a18b}.note{background:#fff0d4;padding:13px 16px;border-radius:14px;color:#806547;line-height:1.6;font-size:13px}.head{display:flex;justify-content:space-between;align-items:end;margin:16px 0}.head h2{margin:0}.head p{margin:7px 0 0;color:#9a8779;font-size:14px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:9px 16px;color:#806d60;font-weight:800;cursor:pointer}.chip.on{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:54px}.card{overflow:hidden;border:1px solid #f0e7dc;border-radius:22px;background:#fffdf8}.card img{width:100%;height:190px;object-fit:cover;display:block}.body{padding:15px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px}.title h3{margin:0;font-size:17px}.label{white-space:nowrap;background:#f7c7bf;color:#8c5a4d;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900}.body p{height:43px;color:#8d7b6f;font-size:13px;line-height:1.6}.foot{display:flex;justify-content:space-between;align-items:center}.status{font-size:11px;color:#80735e;background:#f2efe6;border-radius:99px;padding:6px 9px}.add{border:0;border-radius:99px;background:var(--brown);color:white;padding:8px 12px;font-weight:800}.add:disabled{background:#ded5ca;color:#8d8278}.basket{position:fixed;right:22px;bottom:20px;box-shadow:0 8px 22px #74594b35}.basket b{background:var(--peach);border-radius:99px;padding:2px 8px;margin-left:6px}.overlay{position:fixed;inset:0;background:#30251f77;display:grid;place-items:center;padding:16px}.modal{width:min(460px,100%);max-height:90vh;overflow:auto;border-radius:24px;background:var(--cream);padding:23px}.modal h2{margin-top:0}.close{float:right;border:0;border-radius:50%;width:32px;height:32px;background:#f1e8dc;font-size:20px}.row{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center}.qty{display:flex;align-items:center;gap:9px}.qty button{border:0;border-radius:50%;width:28px;height:28px;background:#f0e6d9;font-weight:900}.field{display:grid;gap:7px;margin:13px 0}.field input,.field textarea{border:1px solid var(--line);background:white;border-radius:12px;padding:11px}.success{text-align:center;padding:24px 4px}.heart{font-size:50px;color:#e7a18b}.footer{text-align:center;border-top:1px dashed #ddcdbb;padding:25px;color:#a18f80;font-size:13px}@media(max-width:700px){.hero{grid-template-columns:1fr;gap:20px;padding-top:26px}.hero img{height:230px;order:-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card img{height:140px}.body{padding:11px}.title h3{font-size:14px}.body p{font-size:12px;height:58px}.add{font-size:11px;padding:7px 9px}.wrap{padding:0 16px}}@media(max-width:370px){.grid{grid-template-columns:1fr}.card img{height:185px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🍳 小厨房<span>开饭啦！</span></div><a href="#menu">今天吃什么 ↓</a></header><section class="hero"><div><div class="eyebrow">A LITTLE HOME CAFE　✿ 今日有好菜</div><h1>小厨房<br>开饭啦！</h1><p>欢迎来到我家的小小菜单角落。这里有已经端上桌的熟悉味道，也有正在偷偷练习的新菜。今天，你想吃点什么？</p><a class="btn" href="#menu" style="text-decoration:none">看看今天吃什么</a></div><img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1200&q=85" alt="家常菜摆满餐桌"></section><div class="note">🧁 GitHub Pages 静态演示版。点菜只在当前页面预览，不会送到主厨；要启用云端点菜，请使用仓库中的 Next.js 源码配置 Supabase。</div><section id="menu"><div class="head"><div><h2>今天想吃什么？ ✿</h2><p>慢慢挑，喜欢的放进点菜篮子吧。</p></div><small>菜单每周更新 · 用心在家做</small></div><div id="filters" class="filters"></div><div id="grid" class="grid"></div></section><footer class="footer">用一顿热乎饭，把日子过得可爱一点 ♡</footer></main><div id="basket"></div><div id="modal"></div><script>
const dishes=[{id:'1',name:'奶油蘑菇烩饭',cat:'暖暖主食',desc:'奶香裹着软糯米粒，撒一把黑胡椒就很满足。',status:'已完成',order:true,tag:'人气',img:'https://images.unsplash.com/photo-1476124369491-e7aaddc5e2?auto=format&fit=crop&w=900&q=85'},{id:'2',name:'蜂蜜照烧鸡腿',cat:'暖暖主食',desc:'甜甜咸咸的酱汁，配白饭刚刚好。',status:'已完成',order:true,tag:'今日推荐',img:'https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85'},{id:'3',name:'草莓云朵松饼',cat:'甜甜点心',desc:'松软得像云朵，顶上有新鲜草莓和奶油。',status:'研发中',order:false,img:'https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=900&q=85'},{id:'4',name:'南瓜浓汤',cat:'暖暖汤汤',desc:'秋天颜色的一碗汤，温柔又暖胃。',status:'已完成',order:true,img:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85'},{id:'5',name:'抹茶巴斯克',cat:'甜甜点心',desc:'想做一款茶香浓浓、中心软软的蛋糕。',status:'想做',order:false,tag:'心愿菜',img:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=85'},{id:'6',name:'蒜香奶油虾',cat:'暖暖主食',desc:'蒜香和奶油在锅里碰面，面包也要准备好。',status:'已完成',order:true,img:'https://images.unsplash.com/photo-1625944525533-473f1a3d54e7?auto=format&fit=crop&w=900&q=85'}];let cat='全部',cart={};const cats=['全部','暖暖主食','暖暖汤汤','甜甜点心'];function draw(){document.querySelector('#filters').innerHTML=cats.map(x=>'<button class="chip '+(cat===x?'on':'')+'" onclick="cat=\''+x+'\';draw()">'+x+'</button>').join('');document.querySelector('#grid').innerHTML=dishes.filter(d=>cat==='全部'||d.cat===cat).map(d=>'<article class="card"><img src="'+d.img+'" alt="'+d.name+'"><div class="body"><div class="title"><h3>'+d.name+'</h3>'+(d.tag?'<span class="label">'+d.tag+'</span>':'')+'</div><p>'+d.desc+'</p><div class="foot"><span class="status">'+d.status+'</span><button class="add" '+(!d.order?'disabled':'')+' onclick="add(\''+d.id+'\')">'+(d.order?'放进篮子 +':'暂未开放')+'</button></div></div></article>').join('');document.querySelector('#basket').innerHTML=Object.values(cart).reduce((a,b)=>a+b,0)?'<button class="btn basket" onclick="showCart()">🧺 点菜篮子 <b>'+Object.values(cart).reduce((a,b)=>a+b,0)+'</b></button>':''}function add(id){cart[id]=(cart[id]||0)+1;draw()}function showCart(){document.querySelector('#modal').innerHTML='<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><h2>🧺 点菜小纸条</h2>'+Object.entries(cart).map(([id,n])=>{let d=dishes.find(x=>x.id===id);return '<div class="row"><b>'+d.name+'</b><div class="qty"><button onclick="qty(\''+id+'\',-1)">−</button>'+n+'<button onclick="qty(\''+id+'\',1)">＋</button></div></div>'}).join('')+'<form onsubmit="send(event)"><div class="field"><label>怎么称呼你？ *</label><input required maxlength="30" name="nickname" placeholder="比如：小圆"></div><div class="field"><label>希望用餐日期</label><input type="date" name="date"></div><div class="field"><label>想对主厨说的话</label><textarea name="note" maxlength="500" rows="3" placeholder="少辣、周末想吃……"></textarea></div><div class="note">演示模式：提交后只在此页面显示，不会送到主厨。</div><button class="btn" style="width:100%;margin-top:12px">预览点菜纸条 ♡</button></form></div></div>'}function qty(id,d){cart[id]+=d;if(cart[id]<1)delete cart[id];draw();showCart()}function closeModal(){document.querySelector('#modal').innerHTML=''}function send(e){e.preventDefault();document.querySelector('#modal').innerHTML='<div class="overlay"><div class="modal success"><div class="heart">♡</div><h2>点菜小纸条送出去啦！</h2><p>等待主厨确认哦～</p><div class="note">演示模式：这张纸条只在当前页面展示，没有送到主厨。</div><button class="btn" style="margin-top:14px" onclick="cart={};draw();closeModal()">好哒</button></div></div>'}draw();
</script></body></html>
